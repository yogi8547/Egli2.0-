# ── n8n Reverse Proxy with SSL (Let's Encrypt) ────────────────────────
# Serves n8n on port 443 with automatic HTTP→HTTPS redirect.
#
# After getting your certificate:
#   sudo certbot certonly --standalone -d jobs.yourdomain.com
#
# Then copy this to /etc/nginx/conf.d/ and reload:
#   sudo nginx -t && sudo systemctl reload nginx
# ────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name jobs.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name jobs.yourdomain.com;

    # ── SSL (Let's Encrypt) ───────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/jobs.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobs.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Request size (resume uploads) ─────────────────────────────────
    client_max_body_size 10M;

    # ── Static assets cache ───────────────────────────────────────────
    location /static/ {
        proxy_pass http://n8n:5678;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── WebSocket support (for n8n workflow editor) ───────────────────
    location /ws {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── Main proxy ────────────────────────────────────────────────────
    location / {
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }
}
